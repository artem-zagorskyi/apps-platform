# Local development services.
# The platform server itself runs on the host for fast reloads.
name: apps-platform-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to localhost only, never expose the dev database to the network
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume keeps data between restarts
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Container is "healthy" once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: