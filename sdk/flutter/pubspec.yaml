name: renvix_sdk
description: Client SDK for the Renvix apps platform.
version: 0.1.0
# Private package: never published to pub.dev
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  args: ^2.7.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  sqflite: ^2.4.5
  uuid: ^4.6.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.renvix.renvix_sdk
        pluginClass: AppPlatformPlugin